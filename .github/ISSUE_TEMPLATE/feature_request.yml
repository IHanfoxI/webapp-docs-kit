name: Feature request
description: Suggest an improvement or a new skill
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The use case, and why the current skills do not cover it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution (optional)
