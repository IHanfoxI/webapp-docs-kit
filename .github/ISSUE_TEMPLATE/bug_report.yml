name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [visual-check, user-manual, video-tutorial, installer / packaging]
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1.x, Codex, Gemini CLI...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command or request, the output, and what you expected. Remove credentials and personal data from logs and screenshots.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config or walkthrough (optional)
      render: json
